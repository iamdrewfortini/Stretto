name: ci
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install cryptography build websockets==15.0.1
      - run: python scripts/release_check.py
      - run: python scripts/docs_lint.py
      - run: python scripts/make_figures.py --check
      - run: python scripts/build_wf13d_table.py && git diff --exit-code packages/wf13d/src/wf13d/data
      - run: python scripts/gen_conformance.py && git diff --exit-code conformance
      - run: python scripts/run_all_tests.py
      - run: python scripts/verify_claims.py --require-all
      - run: bash scripts/test_install.sh
