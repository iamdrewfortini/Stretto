<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" font-family="system-ui,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Rust versus Python speed"><title>Rust versus Python speed</title><rect width="100%" height="100%" fill="white"/><text x="430.0" y="24.0" font-size="15" text-anchor="middle" fill="#1b1f24" font-weight="700">Measured speed, same machine (Linux x86_64, Python 3.13.5): Python vs Rust</text><text x="30.0" y="74.0" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="600">WF-13D table build (262,144 entries)</text><rect x="30.0" y="82.0" width="470.3" height="18.0" rx="0" fill="#2563eb"/><text x="506.3" y="96.0" font-size="10" text-anchor="start" fill="#1b1f24" font-weight="400">Python 3,288.7 ms</text><rect x="30.0" y="104.0" width="176.9" height="18.0" rx="0" fill="#d97706"/><text x="212.9" y="118.0" font-size="10" text-anchor="start" fill="#1b1f24" font-weight="700">Rust 5.0 ms  (658x faster)</text><text x="30.0" y="154.0" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="600">WF-13D one address</text><rect x="30.0" y="162.0" width="474.1" height="18.0" rx="0" fill="#2563eb"/><text x="510.1" y="176.0" font-size="10" text-anchor="start" fill="#1b1f24" font-weight="400">Python 8,387.0 ns</text><rect x="30.0" y="184.0" width="219.0" height="18.0" rx="0" fill="#d97706"/><text x="255.0" y="198.0" font-size="10" text-anchor="start" fill="#1b1f24" font-weight="700">Rust 18.8 ns  (446x faster)</text><text x="30.0" y="234.0" font-size="12" text-anchor="start" fill="#1b1f24" font-weight="600">ant, per step</text><rect x="30.0" y="242.0" width="461.5" height="18.0" rx="0" fill="#2563eb"/><text x="497.5" y="256.0" font-size="10" text-anchor="start" fill="#1b1f24" font-weight="400">Python 583.0 ns</text><rect x="30.0" y="264.0" width="310.3" height="18.0" rx="0" fill="#d97706"/><text x="346.3" y="278.0" font-size="10" text-anchor="start" fill="#1b1f24" font-weight="700">Rust 34.0 ns  (17x faster)</text><text x="30.0" y="312.0" font-size="10" text-anchor="start" fill="#6b7280" font-weight="400">log-scaled bars; ratios depend on the machine; reproduce with scripts/bench_record.py</text></svg>
