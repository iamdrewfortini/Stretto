"white"/><text x="289.0" y="180.4" font-size="8" text-anchor="middle" fill="white" font-weight="700">1101</text><circle cx="504.4" cy="118.3" r="12.0" fill="#65a30d" stroke="white"/><text x="504.4" y="122.3" font-size="8" text-anchor="middle" fill="white" font-weight="700">1110</text><circle cx="458.2" cy="9.7" r="12.0" fill="#15803d" stroke="white"/><text x="458.2" y="13.7" font-size="8" text-anchor="middle" fill="white" font-weight="700">1111</text><text x="600.0" y="80.0" font-size="11" text-anchor="start" fill="#1b1f24" font-weight="700">vertex = (mind_clock, mind_memory, body_clock, body_memory)</text><text x="600.0" y="98.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">bit 1 = that axis measured coherent (≥ 0.7)</text><circle cx="612.0" cy="130.0" r="8.0" fill="#b91c1c"/><text x="630.0" y="134.0" font-size="11" text-anchor="start" fill="#1b1f24" font-weight="400">0 of 4 axes coherent</text><circle cx="612.0" cy="156.0" r="8.0" fill="#d97706"/><text x="630.0" y="160.0" font-size="11" text-anchor="start" fill="#1b1f24" font-weight="400">1 of 4 axes coherent</text><circle cx="612.0" cy="182.0" r="8.0" fill="#ca8a04"/><text x="630.0" y="186.0" font-size="11" text-anchor="start" fill="#1b1f24" font-weight="400">2 of 4 axes coherent</text><circle cx="612.0" cy="208.0" r="8.0" fill="#65a30d"/><text x="630.0" y="212.0" font-size="11" text-anchor="start" fill="#1b1f24" font-weight="400">3 of 4 axes coherent</text><circle cx="612.0" cy="234.0" r="8.0" fill="#15803d"/><text x="630.0" y="238.0" font-size="11" text-anchor="start" fill="#1b1f24" font-weight="400">4 of 4 axes coherent  (all coherent)</text><text x="600.0" y="290.0" font-size="11" text-anchor="start" fill="#1b1f24" font-weight="700">example: bits 1001 = vertex 9, level 2</text><text x="600.0" y="308.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">flips that help: mind_memory, body_clock</text><text x="600.0" y="332.0" font-size="11" text-anchor="start" fill="#1b1f24" font-weight="400">face counts: 16 vertices, 32 edges,</text><text x="600.0" y="348.0" font-size="11" text-anchor="start" fill="#1b1f24" font-weight="400">24 squares, 8 cubes: 16−32+24−8 = 0</text><text x="600.0" y="380.0" font-size="10" text-anchor="start" fill="#6b7280" font-weight="400">a hypothesis about how to organise the measures,</text><text x="600.0" y="394.0" font-size="10" text-anchor="start" fill="#6b7280" font-weight="400">not a physical claim (see docs/STORY.md)</text></svg>
