" y="96.0" font-size="10" text-anchor="middle" fill="#1b1f24" font-weight="700">g5</text><rect x="616.0" y="120.0" width="38.0" height="24.0" rx="4" fill="#fee2e2" stroke="#b91c1c" stroke-width="1"/><text x="635.0" y="136.0" font-size="10" text-anchor="middle" fill="#b91c1c" font-weight="700">g6</text><rect x="668.0" y="80.0" width="38.0" height="24.0" rx="4" fill="white" stroke="#1b1f24" stroke-width="1"/><text x="687.0" y="96.0" font-size="10" text-anchor="middle" fill="#1b1f24" font-weight="700">g7</text><rect x="720.0" y="80.0" width="38.0" height="24.0" rx="4" fill="white" stroke="#1b1f24" stroke-width="1"/><text x="739.0" y="96.0" font-size="10" text-anchor="middle" fill="#1b1f24" font-weight="700">g8</text><rect x="772.0" y="80.0" width="38.0" height="24.0" rx="4" fill="white" stroke="#1b1f24" stroke-width="1"/><text x="791.0" y="96.0" font-size="10" text-anchor="middle" fill="#1b1f24" font-weight="700">g9</text><rect x="450.0" y="270.0" width="400.0" height="150.0" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1"/><text x="462.0" y="292.0" font-size="12" text-anchor="start" fill="#b91c1c" font-weight="700">the checker&#x27;s output</text><text x="462.0" y="316.0" font-size="11" text-anchor="start" fill="#1b1f24" font-weight="600">missing_step: fact &#x27;belt_off&#x27; needed by g6</text><text x="462.0" y="330.0" font-size="10" text-anchor="start" fill="#6b7280" font-weight="400">Step g6 needs &#x27;belt_off&#x27;, but no step makes that true. What di…</text><text x="462.0" y="356.0" font-size="11" text-anchor="start" fill="#1b1f24" font-weight="600">phantom_removal: fact &#x27;belt_off&#x27; needed by g10</text><text x="462.0" y="370.0" font-size="10" text-anchor="start" fill="#6b7280" font-weight="400">Step g10 removes &#x27;belt_off&#x27;, but nothing earlier made it true.…</text><text x="20.0" y="300.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Each step lists what must already be true (requires) and what it makes true/false (adds, removes).</text><text x="20.0" y="318.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Replaying the steps finds every unmet precondition; each becomes ONE targeted question.</text><text x="20.0" y="336.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Answering inserts the step and the graph closes. The trainee guide uses the same graph.</text></svg>
