</text><text x="438.0" y="256.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400">C4..B4</text><line x1="494.0" y1="96.0" x2="604.0" y2="96.0" stroke="#15803d" stroke-width="3"/><text x="550.0" y="88.0" font-size="10" text-anchor="middle" fill="#15803d" font-weight="700">code quality</text><text x="550.0" y="256.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400">C5..B5</text><line x1="606.0" y1="96.0" x2="716.0" y2="96.0" stroke="#0891b2" stroke-width="3"/><text x="662.0" y="88.0" font-size="10" text-anchor="middle" fill="#0891b2" font-weight="700">phrases</text><text x="662.0" y="256.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400">C6..B6</text><line x1="718.0" y1="96.0" x2="828.0" y2="96.0" stroke="#b45309" stroke-width="3"/><text x="774.0" y="88.0" font-size="10" text-anchor="middle" fill="#b45309" font-weight="700">words</text><text x="774.0" y="256.0" font-size="10" text-anchor="middle" fill="#6b7280" font-weight="400">C7..B7</text><text x="22.0" y="274.0" font-size="10" text-anchor="middle" fill="#1b1f24" font-weight="700">A0 27.5 Hz</text><text x="470.0" y="274.0" font-size="10" text-anchor="middle" fill="#1b1f24" font-weight="700">A4 440 Hz</text><text x="838.0" y="274.0" font-size="10" text-anchor="middle" fill="#1b1f24" font-weight="700">C8 4186 Hz</text><text x="14.0" y="60.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">grey = the 4 anchor keys (the four coherence points); each coloured octave = 12 half steps = one signal family; each step up multiplies the frequency by 2^(1/12)</text><text x="14.0" y="292.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">encode(family, level 0..11) puts a quantised measurement on a key; words map to keys with sha256, so the same word is the same key everywhere.</text><text x="14.0" y="312.0" font-size="11" text-anchor="start" fill="#6b7280" font-weight="400">Every 12th key up exactly doubles the frequency. Middle C is key 40 (261.63 Hz).</text></svg>
