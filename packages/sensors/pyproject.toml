[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metacoh-sensors"
version = "0.1.0"
description = "Consent-gated, local-only desktop activity sensors for Humanflow (counts only, never content)"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "iamdrewfortini and contributors" }]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux", "Operating System :: MacOS", "Intended Audience :: Developers"]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
