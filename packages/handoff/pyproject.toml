[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metacoh-handoff"
version = "0.1.0"
description = "Expert work as a verified procedure graph with gap questions and trainee guidance"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "iamdrewfortini and contributors" }]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux", "Intended Audience :: Developers", "Topic :: Scientific/Engineering"]
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]
