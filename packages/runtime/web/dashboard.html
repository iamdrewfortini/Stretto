<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Humanflow runtime dashboard</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #1c2333;
  --muted: #5b6478;
  --card: #f4f6f9;
  --border: #dfe4ec;
  --accent: #2f6f4e;
  --accent-bg: #e3efe7;
  --warn: #9a5b00;
  --warn-bg: #fbf0da;
  --bad: #a83232;
  --num: "SFMono-Regular", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181f;
    --fg: #e6eaf1;
    --muted: #a3adc0;
    --card: #1d232e;
    --border: #333c4d;
    --accent: #7cc79a;
    --accent-bg: #1e3328;
    --warn: #e0b25f;
    --warn-bg: #3a2f17;
    --bad: #e08a8a;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  overflow-x: hidden;
}
header.top {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-wrap: wrap;
  padding: 0.7rem 1rem;
  border-bottom: 1px solid var(--border);
}
header.top h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
header.top .spacer { flex: 1 1 auto; }
header.top a { color: var(--accent); }
.dot {
  width: 0.65rem; height: 0.65rem; border-radius: 50%;
  background: var(--accent); flex: none;
}
.dot.off { background: var(--warn); }
#conn { font-size: 0.85rem; color: var(--muted); }
#conn.bad {
  color: var(--warn); background: var(--warn-bg);
  border: 1px solid var(--warn); border-radius: 0.4rem;
  padding: 0 0.5rem;
}
main {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr));
  gap: 0.75rem;
  padding: 0.75rem 1rem 2rem;
  margin: 0 auto;
  max-width: 70rem;
  width: 100%;
}
section.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 0.6rem;
  padding: 0.7rem 0.8rem;
  min-width: 0;
}
section.card h2 { font-size: 0.95rem; margin: 0 0 0.5rem; font-weight: 600; }
section.card p.hint { font-size: 0.82rem; color: var(--muted); margin: 0.2rem 0; }
.num, td.n, .mins, .clock, .spend {
  font-family: var(--num);
  font-variant-numeric: tabular-nums;
  text-align: right;
  white-space: nowrap;
}
.bar-row {
  display: grid;
  grid-template-columns: 4.5rem 1fr 3.2rem;
  align-items: center;
  gap: 0.5rem;
  margin: 0.25rem 0;
}
.bar-row .lbl { overflow: hidden; text-overflow: ellipsis; }
.track { background: var(--bg); border: 1px solid var(--border); border-radius: 0.3rem; height: 0.7rem; min-width: 0; }
.fill { background: var(--accent); border-radius: 0.25rem; height: 100%; min-width: 2px; }
.total { display: flex; justify-content: space-between; margin-top: 0.5rem; font-weight: 600; }
#timerClock { font-size: 1.6rem; font-family: var(--num); font-variant-numeric: tabular-nums; }
ul.plain { list-style: none; margin: 0.3rem 0; padding: 0; }
ul.plain li {
  padding: 0.3rem 0;
  border-top: 1px solid var(--border);
  overflow-wrap: anywhere;
}
ul.plain li:first-child { border-top: none; }
.task-group { margin: 0.4rem 0; }
.task-group h3 { font-size: 0.82rem; margin: 0.4rem 0 0.1rem; color: var(--muted); font-weight: 600; }
.convo-msg { margin: 0.3rem 0; overflow-wrap: anywhere; }
.convo-msg .who { font-size: 0.78rem; color: var(--muted); }
table.calls { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
table.calls th, table.calls td { padding: 0.2rem 0.3rem; border-top: 1px solid var(--border); }
table.calls th { text-align: left; color: var(--muted); font-weight: 600; font-size: 0.78rem; }
table.calls td.n, table.calls th.n { text-align: right; }
.meta { font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }
form.turn { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
form.turn input {
  flex: 1 1 auto; min-width: 0;
  font: inherit; color: var(--fg); background: var(--bg);
  border: 1px solid var(--border); border-radius: 0.4rem; padding: 0.45rem 0.6rem;
}
form.turn button {
  font: inherit; cursor: pointer;
  color: #fff; background: var(--accent);
  border: 1px solid var(--accent); border-radius: 0.4rem; padding: 0.45rem 0.8rem;
}
#reply { margin-top: 0.5rem; overflow-wrap: anywhere; }
#reply.err { color: var(--bad); }
ol.plan { margin: 0.3rem 0 0.3rem 1.2rem; padding: 0; }
ol.plan li { margin: 0.15rem 0; overflow-wrap: anywhere; }
</style>
</head>
<body>
<header class="top">
  <span class="dot" id="dot" aria-hidden="true"></span>
  <h1>Humanflow runtime</h1>
  <span id="conn" role="status">live</span>
  <span class="spacer"></span>
  <a href="/">voice page</a>
</header>
<main>
  <section class="card" aria-label="Today">
    <h2>Today</h2>
    <div id="bars"></div>
    <div class="total"><span>Total</span><span class="num" id="todayTotal">0 min</span></div>
  </section>
  <section class="card" aria-label="Running timer">
    <h2>Timer</h2>
    <div id="timerClock">--:--</div>
    <p class="hint" id="timerMeta">no timer running</p>
  </section>
  <section class="card" aria-label="Tasks">
    <h2>Tasks</h2>
    <div id="tasks"></div>
  </section>
  <section class="card" aria-label="Talk to the core">
    <h2>Talk</h2>
    <div id="convo"></div>
    <form class="turn" id="turnForm">
      <input id="turnInput" type="text" autocomplete="off"
             placeholder="Say something, e.g. I focused for 25 minutes" aria-label="Message">
      <button type="submit">Send</button>
    </form>
    <div id="reply" aria-live="polite"></div>
  </section>
  <section class="card" aria-label="Model calls">
    <h2>Calls</h2>
    <div id="callStats"></div>
    <table class="calls">
      <thead><tr><th>model</th><th>role</th><th class="n">status</th><th class="n">ms</th></tr></thead>
      <tbody id="callRows"></tbody>
    </table>
  </section>
  <section class="card" aria-label="Agents">
    <h2>Agents</h2>
    <div id="agents"></div>
  </section>
  <section class="card" aria-label="Timeline">
    <h2>Timeline</h2>
    <ul class="plain" id="timeline"></ul>
  </section>
</main>
<script>
"use strict";
var CATS = ["focus", "meeting", "comms", "search", "wait", "admin", "other"];
var STATUSES = ["todo", "doing", "blocked", "done"];
var state = {
  ledger: [], timer: null, tasks: {},
  convo: [], calls: [], spent: 0,
  insights: [], plans: [], timeline: []
};

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function fmtClock(d) {
  function p(x) { return (x < 10 ? "0" : "") + x; }
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
function evtTime(ev) {
  var d = new Date(ev.ts);
  return isNaN(d.getTime()) ? "--:--:--" : fmtClock(d);
}
function startOfTodayS() {
  var d = new Date(); d.setHours(0, 0, 0, 0);
  return d.getTime() / 1000;
}
function mmss(elapsedS) {
  elapsedS = Math.max(0, Math.floor(elapsedS));
  var m = Math.floor(elapsedS / 60), s = elapsedS % 60;
  return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
}

// --- today panel ---
function renderToday() {
  var start = startOfTodayS();
  var mins = {}, total = 0;
  var i, e;
  for (i = 0; i < CATS.length; i++) mins[CATS[i]] = 0;
  for (i = 0; i < state.ledger.length; i++) {
    e = state.ledger[i];
    if (typeof e.t !== "number" || e.t < start) continue;
    if (mins[e.activity] === undefined) mins.other += 0;
    var a = (CATS.indexOf(e.activity) >= 0) ? e.activity : "other";
    var m = (typeof e.duration_s === "number" ? e.duration_s : 0) / 60;
    mins[a] += m; total += m;
  }
  var max = 0, k;
  for (k in mins) if (mins[k] > max) max = mins[k];
  var box = document.getElementById("bars");
  while (box.firstChild) box.removeChild(box.firstChild);
  for (i = 0; i < CATS.length; i++) {
    (function (cat) {
      var row = el("div", "bar-row");
      row.appendChild(el("span", "lbl", cat));
      var track = el("div", "track");
      var fill = el("div", "fill");
      fill.style.width = (max > 0 ? (100 * mins[cat] / max).toFixed(1) : "0") + "%";
      fill.title = mins[cat].toFixed(1) + " min " + cat;
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el("span", "mins", mins[cat].toFixed(1)));
      box.appendChild(row);
    })(CATS[i]);
  }
  var tt = document.getElementById("todayTotal");
  while (tt.firstChild) tt.removeChild(tt.firstChild);
  tt.appendChild(document.createTextNode(total.toFixed(1) + " min"));
}

// --- timer panel ---
function renderTimer() {
  var clock = document.getElementById("timerClock");
  var meta = document.getElementById("timerMeta");
  while (clock.firstChild) clock.removeChild(clock.firstChild);
  while (meta.firstChild) meta.removeChild(meta.firstChild);
  if (state.timer) {
    var nowS = Date.now() / 1000;
    clock.appendChild(document.createTextNode(mmss(nowS - state.timer.t)));
    meta.appendChild(document.createTextNode("timing " + state.timer.activity));
  } else {
    clock.appendChild(document.createTextNode("--:--"));
    meta.appendChild(document.createTextNode("no timer running"));
  }
}
window.setInterval(renderTimer, 1000);

// --- tasks panel ---
function renderTasks() {
  var box = document.getElementById("tasks");
  while (box.firstChild) box.removeChild(box.firstChild);
  var ids = Object.keys(state.tasks);
  if (!ids.length) {
    box.appendChild(el("p", "hint", "no tasks yet"));
    return;
  }
  var s, list, t, li, span;
  for (s = 0; s < STATUSES.length; s++) {
    (function (st) {
      var group = el("div", "task-group");
      group.appendChild(el("h3", null, st));
      list = el("ul", "plain");
      var n = 0, j;
      for (j = 0; j < ids.length; j++) {
        t = state.tasks[ids[j]];
        if (t.status !== st) continue;
        n++;
        li = el("li");
        li.appendChild(document.createTextNode(t.title || t.task_id));
        if (typeof t.estimate_min === "number") {
          li.appendChild(document.createTextNode(" "));
          span = el("span", "num", t.estimate_min + " min");
          li.appendChild(span);
        }
        list.appendChild(li);
      }
      if (!n) list.appendChild(el("li", "meta", "none"));
      group.appendChild(list);
      box.appendChild(group);
    })(STATUSES[s]);
  }
}

// --- conversation strip ---
function renderConvo() {
  var box = document.getElementById("convo");
  while (box.firstChild) box.removeChild(box.firstChild);
  if (!state.convo.length) {
    box.appendChild(el("p", "hint", "no turns yet"));
    return;
  }
  state.convo.slice(-10).forEach(function (m) {
    var div = el("div", "convo-msg");
    div.appendChild(el("div", "who", m.who === "you" ? "you" : "core"));
    div.appendChild(document.createTextNode(m.text));
    if (m.extra) div.appendChild(el("div", "meta", m.extra));
    box.appendChild(div);
  });
}

// --- calls panel ---
function p50(xs) {
  if (!xs.length) return 0;
  var s = xs.slice().sort(function (a, b) { return a - b; });
  var i = Math.floor((s.length - 1) / 2);
  return s[i];
}
function renderCalls() {
  var stats = document.getElementById("callStats");
  while (stats.firstChild) stats.removeChild(stats.firstChild);
  var lat = state.calls.map(function (c) { return c.latency_ms; })
    .filter(function (x) { return typeof x === "number"; });
  var line = "count " + state.calls.length +
    " · p50 " + Math.round(p50(lat)) + " ms" +
    " · spend $" + Number(state.spent || 0).toFixed(4);
  stats.appendChild(el("p", "hint num", line));
  var tb = document.getElementById("callRows");
  while (tb.firstChild) tb.removeChild(tb.firstChild);
  if (!state.calls.length) {
    var tr0 = el("tr");
    var td0 = el("td", "meta", "no calls yet");
    td0.colSpan = 4;
    tr0.appendChild(td0);
    tb.appendChild(tr0);
    return;
  }
  state.calls.slice(-10).reverse().forEach(function (c) {
    var tr = el("tr");
    tr.appendChild(el("td", null, String(c.model || "?")));
    tr.appendChild(el("td", null, String(c.role || "?")));
    tr.appendChild(el("td", "n", String(c.status)));
    tr.appendChild(el("td", "n", typeof c.latency_ms === "number" ? String(Math.round(c.latency_ms)) : "?"));
    tb.appendChild(tr);
  });
}

// --- agents panel ---
function resolveTitle(item) {
  if (typeof item !== "string") return JSON.stringify(item);
  var t = state.tasks[item];
  return t ? t.title : item;
}
function renderAgents() {
  var box = document.getElementById("agents");
  while (box.firstChild) box.removeChild(box.firstChild);
  if (!state.insights.length && !state.plans.length) {
    box.appendChild(el("p", "hint", "no agent output yet"));
    return;
  }
  var ul = el("ul", "plain");
  state.insights.slice(-8).reverse().forEach(function (ins) {
    var li = el("li");
    var head = (ins.agent ? ins.agent + " · " : "") + (ins.kind || "insight");
    li.appendChild(el("div", "meta", head));
    li.appendChild(document.createTextNode(ins.text || ""));
    ul.appendChild(li);
  });
  box.appendChild(ul);
  state.plans.slice(-4).reverse().forEach(function (p) {
    var div = el("div", "task-group");
    div.appendChild(el("h3", null, "plan"));
    if (p.next) div.appendChild(el("p", "hint", "next: " + p.next));
    var ol = el("ol", "plan");
    (Array.isArray(p.order) ? p.order : []).forEach(function (item) {
      ol.appendChild(el("li", null, resolveTitle(item)));
    });
    div.appendChild(ol);
    if (p.rationale) div.appendChild(el("p", "hint", p.rationale));
    box.appendChild(div);
  });
}

// --- timeline ---
function summarize(ev) {
  var d = ev.data || {}, t = ev.type;
  if (t === "ledger.event.added")
    return (d.activity || "?") + " " + (Number(d.duration_s || 0) / 60).toFixed(1) + " min" + (d.text ? " — " + d.text : "");
  if (t === "timer.started") return "start " + (d.activity || "?");
  if (t === "timer.stopped") return "stop " + Math.round(Number(d.seconds || 0)) + " s";
  if (t === "task.created") return "created: " + (d.title || d.task_id || "?");
  if (t === "task.updated") return (d.task_id || "?") + " → " + (d.status || "?");
  if (t === "core.turn.started") return String(d.text || "").slice(0, 80);
  if (t === "core.turn.completed") return String(d.reply || "").slice(0, 80);
  if (t === "gateway.call")
    return (d.model || "?") + " " + String(d.status) + " " + Math.round(Number(d.latency_ms || 0)) + " ms";
  if (t === "insight.proposed") return String(d.text || "").slice(0, 80);
  if (t === "plan.proposed")
    return "plan: " + (Array.isArray(d.order) ? d.order.length : 0) + " steps" + (d.next ? " · next " + d.next : "");
  if (t === "tool.called" || t === "tool.result") return (d.name || "?") + (d.ok === false ? " failed" : "");
  try { return JSON.stringify(d).slice(0, 80); } catch (e) { return ""; }
}
function renderTimeline() {
  var box = document.getElementById("timeline");
  while (box.firstChild) box.removeChild(box.firstChild);
  state.timeline.slice(-30).reverse().forEach(function (ev) {
    var li = el("li");
    li.appendChild(el("div", "meta", evtTime(ev) + " · " + ev.type));
    li.appendChild(document.createTextNode(summarize(ev)));
    box.appendChild(li);
  });
}

// --- event dispatch ---
function handleEvent(ev) {
  if (!ev || typeof ev.type !== "string") return;
  var d = ev.data || {};
  state.timeline.push(ev);
  if (state.timeline.length > 60) state.timeline = state.timeline.slice(-60);
  switch (ev.type) {
    case "ledger.event.added":
      state.ledger.push({ t: d.t, activity: d.activity, duration_s: d.duration_s, text: d.text });
      renderToday();
      break;
    case "timer.started":
      state.timer = { activity: d.activity, t: d.t };
      renderTimer();
      break;
    case "timer.stopped":
      state.timer = null;
      renderTimer();
      break;
    case "task.created":
      state.tasks[d.task_id] = { task_id: d.task_id, title: d.title, status: d.status || "todo", estimate_min: d.estimate_min };
      renderTasks(); renderAgents();
      break;
    case "task.updated":
      if (state.tasks[d.task_id]) state.tasks[d.task_id].status = d.status;
      else state.tasks[d.task_id] = { task_id: d.task_id, title: d.task_id, status: d.status };
      renderTasks(); renderAgents();
      break;
    case "core.turn.started":
      state.convo.push({ who: "you", text: String(d.text || "") });
      if (state.convo.length > 40) state.convo = state.convo.slice(-40);
      renderConvo();
      break;
    case "core.turn.completed": {
      var tools = Array.isArray(d.tool_calls) ? d.tool_calls : [];
      var names = tools.map(function (c) { return (c.name || "?") + (c.ok === false ? "✗" : "✓"); }).join(", ");
      var extra = "model " + (d.model || "?") + " · " + (d.ms || 0) + " ms" + (names ? " · " + names : "");
      state.convo.push({ who: "core", text: String(d.reply || ""), extra: extra });
      if (state.convo.length > 40) state.convo = state.convo.slice(-40);
      renderConvo();
      break;
    }
    case "gateway.call":
      state.calls.push({ model: d.model, role: d.role, status: d.status, latency_ms: d.latency_ms });
      if (typeof d.spent_usd === "number") state.spent = d.spent_usd;
      renderCalls();
      break;
    case "insight.proposed":
      state.insights.push({ agent: d.agent || ev.source, kind: d.kind, text: d.text });
      renderAgents();
      break;
    case "plan.proposed":
      state.plans.push({ order: d.order, next: d.next, rationale: d.rationale });
      renderAgents();
      break;
    default:
      break; // unknown types feed the timeline only
  }
  renderTimeline();
}

// --- stream ---
var connEl = document.getElementById("conn");
var dotEl = document.getElementById("dot");
function setConn(ok, text) {
  while (connEl.firstChild) connEl.removeChild(connEl.firstChild);
  connEl.appendChild(document.createTextNode(text));
  connEl.className = ok ? "" : "bad";
  dotEl.className = ok ? "dot" : "dot off";
}
function connect() {
  var src;
  try {
    src = new EventSource("/v1/events");
  } catch (e) {
    setConn(false, "reconnecting…");
    window.setTimeout(connect, 3000);
    return;
  }
  src.onopen = function () { setConn(true, "live"); };
  src.onmessage = function (msg) {
    try { handleEvent(JSON.parse(msg.data)); }
    catch (e) { /* ignore one bad line */ }
  };
  src.onerror = function () {
    setConn(false, "reconnecting…");
    try { src.close(); } catch (e) { /* already closed */ }
    window.setTimeout(connect, 3000);
  };
}
renderToday(); renderTimer(); renderTasks(); renderConvo(); renderCalls(); renderAgents(); renderTimeline();
connect();

// --- turn form ---
document.getElementById("turnForm").addEventListener("submit", function (ev) {
  ev.preventDefault();
  var input = document.getElementById("turnInput");
  var replyBox = document.getElementById("reply");
  var text = input.value.trim();
  if (!text) return;
  while (replyBox.firstChild) replyBox.removeChild(replyBox.firstChild);
  replyBox.className = "";
  replyBox.appendChild(document.createTextNode("…"));
  fetch("/v1/turn", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text: text })
  }).then(function (r) {
    if (!r.ok) throw new Error("turn failed: HTTP " + r.status);
    return r.json();
  }).then(function (out) {
    while (replyBox.firstChild) replyBox.removeChild(replyBox.firstChild);
    replyBox.appendChild(document.createTextNode(String(out.reply || "")));
    input.value = "";
  }).catch(function (err) {
    while (replyBox.firstChild) replyBox.removeChild(replyBox.firstChild);
    replyBox.className = "err";
    replyBox.appendChild(document.createTextNode(String((err && err.message) || err)));
  });
});
</script>
</body>
</html>
