<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Humanflow leaks</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #1c2333;
  --muted: #5b6478;
  --card: #f4f6f9;
  --border: #dfe4ec;
  --accent: #2f6f4e;
  --accent-bg: #e3efe7;
  --warn: #9a5b00;
  --warn-bg: #fbf0da;
  --num: "SFMono-Regular", ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14181f;
    --fg: #e6eaf1;
    --muted: #a3adc0;
    --card: #1d232e;
    --border: #333c4d;
    --accent: #7cc79a;
    --accent-bg: #1e3328;
    --warn: #e0b25f;
    --warn-bg: #3a2f17;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  overflow-x: hidden;
}
header.top {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-wrap: wrap;
  padding: 0.7rem 1rem;
  border-bottom: 1px solid var(--border);
}
header.top h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
header.top .spacer { flex: 1 1 auto; }
header.top a { color: var(--accent); }
header.top nav { display: flex; gap: 0.8rem; }
#conn { font-size: 0.85rem; color: var(--muted); }
#conn.bad {
  color: var(--warn); background: var(--warn-bg);
  border: 1px solid var(--warn); border-radius: 0.4rem;
  padding: 0 0.5rem;
}
.dot { width: 0.65rem; height: 0.65rem; border-radius: 50%; background: var(--accent); flex: none; }
.dot.off { background: var(--warn); }
main {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr));
  gap: 0.75rem;
  padding: 0.75rem 1rem 2rem;
  margin: 0 auto;
  max-width: 70rem;
  width: 100%;
}
section.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 0.6rem;
  padding: 0.7rem 0.8rem;
  min-width: 0;
}
section.card h2 { font-size: 0.95rem; margin: 0 0 0.5rem; font-weight: 600; }
section.card p.hint, p.hint { font-size: 0.82rem; color: var(--muted); margin: 0.2rem 0; }
.num, .mins {
  font-family: var(--num);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
#scoreBig {
  font-family: var(--num);
  font-variant-numeric: tabular-nums;
  font-size: 3rem;
  line-height: 1;
  font-weight: 700;
}
.score-label { font-size: 0.82rem; color: var(--muted); }
.bar-row {
  display: grid;
  grid-template-columns: 5.5rem 1fr 3.4rem;
  align-items: center;
  gap: 0.5rem;
  margin: 0.25rem 0;
}
.bar-row .lbl { overflow: hidden; text-overflow: ellipsis; font-size: 0.85rem; }
.track { background: var(--bg); border: 1px solid var(--border); border-radius: 0.3rem; height: 0.7rem; min-width: 0; }
.fill { background: var(--accent); border-radius: 0.25rem; height: 100%; min-width: 2px; }
.tiles {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr));
  gap: 0.5rem;
  margin-top: 0.6rem;
}
.tile {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 0.5rem;
  padding: 0.5rem 0.6rem;
}
.tile h3 { font-size: 0.8rem; margin: 0 0 0.2rem; color: var(--muted); font-weight: 600; }
.tile .h { font-family: var(--num); font-variant-numeric: tabular-nums; font-weight: 600; }
.tile .d { font-family: var(--num); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.85rem; }
ol.ranked { list-style: none; margin: 0.3rem 0; padding: 0; counter-reset: rank; }
ol.ranked li {
  padding: 0.4rem 0 0.4rem 2rem;
  border-top: 1px solid var(--border);
  position: relative;
  overflow-wrap: anywhere;
}
ol.ranked li:first-child { border-top: none; }
ol.ranked li .rank {
  position: absolute; left: 0; top: 0.4rem;
  font-family: var(--num); font-variant-numeric: tabular-nums;
  color: var(--muted); width: 1.6rem;
}
ol.ranked li .win { font-family: var(--num); font-variant-numeric: tabular-nums; font-weight: 600; }
ol.ranked li .cost { font-size: 0.82rem; color: var(--muted); }
.xp-track { background: var(--bg); border: 1px solid var(--border); border-radius: 0.4rem; height: 0.9rem; }
.xp-fill { background: var(--accent); border-radius: 0.3rem; height: 100%; min-width: 2px; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 10px; }
.legend { display: flex; gap: 1rem; font-size: 0.82rem; color: var(--muted); margin-top: 0.3rem; flex-wrap: wrap; }
.legend .sw { display: inline-block; width: 1.2rem; height: 0.2rem; vertical-align: middle; margin-right: 0.3rem; }
details.assump { margin-top: 0.6rem; font-size: 0.82rem; color: var(--muted); }
details.assump summary { cursor: pointer; color: var(--accent); }
details.assump dl { margin: 0.4rem 0 0; display: grid; grid-template-columns: auto 1fr; gap: 0.15rem 0.6rem; }
details.assump dt { font-family: var(--num); font-variant-numeric: tabular-nums; }
details.assump dd { margin: 0; overflow-wrap: anywhere; }
.meta { font-size: 0.82rem; color: var(--muted); overflow-wrap: anywhere; }
</style>
</head>
<body>
<header class="top">
  <span class="dot" id="dot" aria-hidden="true"></span>
  <h1>Humanflow leaks</h1>
  <span id="conn" role="status">connecting…</span>
  <span class="spacer"></span>
  <nav>
    <a href="/">voice</a>
    <a href="/dashboard">dashboard</a>
  </nav>
</header>
<main>
  <section class="card" aria-label="Leak score">
    <h2>Leak score</h2>
    <div id="scoreBox">
      <div id="scoreBig">—</div>
      <div class="score-label">lower is better</div>
    </div>
    <div id="compBars"></div>
    <div class="tiles" id="compTiles"></div>
  </section>
  <section class="card" aria-label="Suggestions">
    <h2>Small changes, ranked</h2>
    <div id="suggBox"><p class="hint">waiting for suggestions…</p></div>
  </section>
  <section class="card" aria-label="Progress">
    <h2>Progress</h2>
    <div id="progBox"><p class="hint">waiting for progress…</p></div>
  </section>
  <section class="card" aria-label="Trajectory">
    <h2>Trajectory</h2>
    <div id="trajBox"><p class="hint">waiting for forecast…</p></div>
    <svg class="chart" id="trajChart" viewBox="0 0 320 180" role="img" aria-label="cumulative hours over weeks"></svg>
    <div class="legend" id="trajLegend"></div>
    <div id="trajSummary"></div>
  </section>
  <section class="card" aria-label="Assumptions">
    <h2>Assumptions</h2>
    <details class="assump" id="assumpBox">
      <summary>Assumptions</summary>
      <div id="assumpList"><p class="hint">waiting for data…</p></div>
    </details>
  </section>
</main>
<script>
"use strict";
var SVGNS = "http://www.w3.org/2000/svg";
var COMPONENTS = ["switching", "waiting", "re-finding", "admin"];
var COMPS = [
  { key: "switching", label: "switching" },
  { key: "waiting", label: "waiting" },
  { key: "re-finding", label: "re-finding" },
  { key: "admin", label: "admin" }
];
var PERIODS = ["week", "month", "year", "decade"];
var latest = { leaks: null, suggestions: null, progress: null, trajectory: null };

function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function clear(node) {
  while (node.firstChild) node.removeChild(node.firstChild);
}
function num(x, dflt) {
  var v = Number(x);
  return isFinite(v) ? v : dflt;
}
function fmtHours(h) { return num(h, 0).toFixed(1) + " h"; }
function fmtUSD(u) { return "$" + Math.round(num(u, 0)); }
function fmtMin(m) { return num(m, 0).toFixed(1) + " min"; }

// --- leaks.computed ---
function renderLeaks(d) {
  var scoreBox = document.getElementById("scoreBig");
  clear(scoreBox);
  scoreBox.appendChild(document.createTextNode(String(Math.round(num(d.leak_score, 0)))));
  var bars = document.getElementById("compBars");
  clear(bars);
  var per = (d && d.per_day_min) || {};
  var max = 0, i;
  for (i = 0; i < COMPS.length; i++) max = Math.max(max, num(per[COMPS[i].key], 0));
  for (i = 0; i < COMPS.length; i++) {
    (function (c) {
      var v = num(per[c.key], 0);
      var row = el("div", "bar-row");
      row.appendChild(el("span", "lbl", c.label));
      var track = el("div", "track");
      var fill = el("div", "fill");
      fill.style.width = (max > 0 ? (100 * v / max).toFixed(1) : "0") + "%";
      fill.title = v.toFixed(1) + " min/day " + c.label;
      track.appendChild(fill);
      row.appendChild(track);
      row.appendChild(el("span", "mins", v.toFixed(1)));
      bars.appendChild(row);
    })(COMPS[i]);
  }
  var tiles = document.getElementById("compTiles");
  clear(tiles);
  var comp = (d && d.compounded) || {};
  PERIODS.forEach(function (p) {
    var c = comp[p] || {};
    var t = el("div", "tile");
    t.appendChild(el("h3", null, p));
    t.appendChild(el("div", "h", fmtHours(c.hours)));
    t.appendChild(el("div", "d", fmtUSD(c.usd)));
    tiles.appendChild(t);
  });
  renderAssumptions(d && d.assumptions);
}

function renderAssumptions(a) {
  var box = document.getElementById("assumpList");
  clear(box);
  if (!a || typeof a !== "object" || !Object.keys(a).length) {
    box.appendChild(el("p", "hint", "waiting for data…"));
    return;
  }
  var dl = document.createElement("dl");
  Object.keys(a).forEach(function (k) {
    dl.appendChild(el("dt", null, k));
    dl.appendChild(el("dd", null, String(a[k])));
  });
  box.appendChild(dl);
}

// --- suggestions.ranked ---
function hasNumbers(it) {
  return it &&
    isFinite(Number(it.winback_hours_year)) &&
    isFinite(Number(it.winback_usd_year)) &&
    isFinite(Number(it.adopt_cost_min)) &&
    isFinite(Number(it.adopt_cost_usd));
}
function renderSuggestions(d) {
  var box = document.getElementById("suggBox");
  clear(box);
  var items = (d && Array.isArray(d.items)) ? d.items.filter(hasNumbers) : [];
  if (!items.length) {
    box.appendChild(el("p", "hint", "waiting for suggestions…"));
    return;
  }
  var ol = el("ol", "ranked");
  items.forEach(function (it, idx) {
    var li = document.createElement("li");
    li.appendChild(el("span", "rank", String(idx + 1)));
    li.appendChild(document.createTextNode(String(it.text || "")));
    li.appendChild(document.createElement("br"));
    var win = "+" + num(it.winback_hours_year, 0).toFixed(1) +
      " h/yr (\u2248 " + fmtUSD(it.winback_usd_year) + ") won back";
    li.appendChild(el("div", "win", win));
    var cost = "cost: " + num(it.adopt_cost_min, 0).toFixed(0) +
      " min (+" + fmtUSD(it.adopt_cost_usd) + ")";
    li.appendChild(el("div", "cost", cost));
    ol.appendChild(li);
  });
  box.appendChild(ol);
}

// --- progress.updated ---
function renderProgress(d) {
  var box = document.getElementById("progBox");
  clear(box);
  if (!d || typeof d.level_name !== "string") {
    box.appendChild(el("p", "hint", "waiting for progress…"));
    return;
  }
  box.appendChild(el("div", "num", "Level " + num(d.level, 0) + " \u2014 " + d.level_name));
  var into = num(d.xp_into_level, 0), next = num(d.xp_for_next, 1);
  if (!(next > 0)) next = 1;
  var track = el("div", "xp-track");
  var fill = el("div", "xp-fill");
  fill.style.width = Math.min(100, 100 * Math.max(0, into) / next).toFixed(1) + "%";
  track.appendChild(fill);
  box.appendChild(track);
  box.appendChild(el("p", "hint num", into + " of " + next + " XP"));
  box.appendChild(el("p", "hint num", fmtMin(d.won_back_min) + " won back"));
}

// --- trajectory.forecast ---
function renderTrajectory(d) {
  var svg = document.getElementById("trajChart");
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  var legend = document.getElementById("trajLegend");
  clear(legend);
  var summary = document.getElementById("trajSummary");
  clear(summary);
  var box = document.getElementById("trajBox");
  clear(box);
  if (!d || !Array.isArray(d.weeks) || !d.weeks.length ||
      !Array.isArray(d.current_hours) || !Array.isArray(d.adopted_hours)) {
    box.appendChild(el("p", "hint", "waiting for forecast…"));
    return;
  }
  var W = 320, H = 180, PL = 36, PR = 8, PT = 10, PB = 22;
  var n = Math.min(d.weeks.length, d.current_hours.length, d.adopted_hours.length);
  var maxY = 0, i;
  for (i = 0; i < n; i++) {
    maxY = Math.max(maxY, num(d.current_hours[i], 0), num(d.adopted_hours[i], 0));
  }
  if (!(maxY > 0)) maxY = 1;
  function X(i) { return PL + (W - PL - PR) * (n <= 1 ? 0 : i / (n - 1)); }
  function Y(v) { return PT + (H - PT - PB) * (1 - Math.max(0, v) / maxY); }
  function gridLine(yv, label) {
    var ln = document.createElementNS(SVGNS, "line");
    ln.setAttribute("x1", PL); ln.setAttribute("x2", W - PR);
    ln.setAttribute("y1", Y(yv)); ln.setAttribute("y2", Y(yv));
    ln.setAttribute("stroke", "currentColor");
    ln.setAttribute("stroke-opacity", "0.2");
    svg.appendChild(ln);
    var t = document.createElementNS(SVGNS, "text");
    t.setAttribute("x", 2); t.setAttribute("y", Y(yv) + 3);
    t.textContent = label;
    svg.appendChild(t);
  }
  gridLine(maxY, num(maxY, 0).toFixed(0) + "h");
  gridLine(maxY / 2, num(maxY / 2, 0).toFixed(0) + "h");
  gridLine(0, "0h");
  function series(vals, color, dash) {
    var pts = [];
    var i;
    for (i = 0; i < n; i++) pts.push(X(i).toFixed(1) + "," + Y(num(vals[i], 0)).toFixed(1));
    var pl = document.createElementNS(SVGNS, "polyline");
    pl.setAttribute("points", pts.join(" "));
    pl.setAttribute("fill", "none");
    pl.setAttribute("stroke", color);
    pl.setAttribute("stroke-width", "2");
    if (dash) pl.setAttribute("stroke-dasharray", dash);
    svg.appendChild(pl);
  }
  series(d.current_hours, "#b3543f", null);
  series(d.adopted_hours, "#2f6f4e", "5,3");
  var xl = document.createElementNS(SVGNS, "text");
  xl.setAttribute("x", PL); xl.setAttribute("y", H - 6);
  xl.textContent = "week 1";
  svg.appendChild(xl);
  var xr = document.createElementNS(SVGNS, "text");
  xr.setAttribute("x", W - PR - 34); xr.setAttribute("y", H - 6);
  xr.textContent = "week " + String(d.weeks[n - 1]);
  svg.appendChild(xr);
  function legItem(color, dash, label) {
    var s = el("span", null, null);
    var sw = el("span", "sw", null);
    sw.style.background = color;
    if (dash) sw.style.height = "0";
    s.appendChild(sw);
    s.appendChild(document.createTextNode(label));
    legend.appendChild(s);
  }
  legItem("#b3543f", null, "current");
  legItem("#2f6f4e", true, "adopted");
  var wonH = num(d.won_back_hours, 0), wonU = num(d.won_back_usd, 0);
  box.appendChild(el("p", "hint num", fmtHours(wonH) + " won back (\u2248 " + fmtUSD(wonU) + ")"));
  summary.appendChild(el("p", "meta", "cumulative leaked hours, current vs adopted"));
}

// --- event dispatch: keep latest of each known type ---
function handleEnvelope(env) {
  if (!env || typeof env.type !== "string") return;
  var data = (env.data !== undefined) ? env.data : {};
  switch (env.type) {
    case "leaks.computed":
      latest.leaks = data;
      renderLeaks(data);
      break;
    case "suggestions.ranked":
      latest.suggestions = data;
      renderSuggestions(data);
      break;
    case "progress.updated":
      latest.progress = data;
      renderProgress(data);
      break;
    case "trajectory.forecast":
      latest.trajectory = data;
      renderTrajectory(data);
      break;
    default:
      break;
  }
}

// --- stream ---
var connEl = document.getElementById("conn");
var dotEl = document.getElementById("dot");
function setConn(ok, text) {
  clear(connEl);
  connEl.appendChild(document.createTextNode(text));
  connEl.className = ok ? "" : "bad";
  dotEl.className = ok ? "dot" : "dot off";
}
function connect() {
  var src;
  try {
    src = new EventSource("/v1/events");
  } catch (e) {
    setConn(false, "reconnecting…");
    window.setTimeout(connect, 3000);
    return;
  }
  src.onopen = function () { setConn(true, "live"); };
  src.onmessage = function (msg) {
    try { handleEnvelope(JSON.parse(msg.data)); }
    catch (e) { /* ignore one bad line */ }
  };
  src.onerror = function () {
    setConn(false, "reconnecting…");
    try { src.close(); } catch (e) { /* already closed */ }
    window.setTimeout(connect, 3000);
  };
}
connect();
</script>
</body>
</html>
