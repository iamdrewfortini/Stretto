[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "metacoh"
version = "0.1.0"
description = "Umbrella distribution and the metacoh command"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "iamdrewfortini and contributors" }]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX :: Linux", "Intended Audience :: Developers", "Topic :: Scientific/Engineering"]
dependencies = ["metacoh-wf13d", "metacoh-coherence", "metacoh-metarouter", "metacoh-harness", "metacoh-telemetry", "metacoh-cells", "metacoh-perception", "metacoh-humanflow", "metacoh-assistant", "metacoh-finetune", "metacoh-handoff", "metacoh-resonate", "metacoh-adapters"]

[project.scripts]
metacoh = "metacoh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
